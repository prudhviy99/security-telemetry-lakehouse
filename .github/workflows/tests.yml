name: tests

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency-light test extras
        run: pip install -e ".[dev]"
      - name: Run contract and mart tests
        run: pytest -m "not spark" -q
